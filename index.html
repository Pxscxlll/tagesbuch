<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#1B6B58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"></head><body>
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: Monatskalender links, Tagesmaske mit Tabs rechts; auf dem Handy untereinander. */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --surface-2: #E3EAE6;
  --line: #D1DAD5;
  --fg: #15201C;
  --muted: #5A6760;
  --accent: #1B6B58;
  --accent-ink: #FFFFFF;
  --c-weight: #1B6B58;
  --c-sport: #B3600C;
  --c-task: #3558C4;
  --c-event: #8B3FA0;
  --danger: #B3342B;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412;
    --surface: #161E1B;
    --surface-2: #1F2925;
    --line: #2B3732;
    --fg: #E7EFEB;
    --muted: #95A59D;
    --accent: #5CC4A6;
    --accent-ink: #0B1511;
    --c-weight: #5CC4A6;
    --c-sport: #E39A4A;
    --c-task: #8CA6F2;
    --c-event: #C58AE0;
    --danger: #F0847B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412;
  --surface: #161E1B;
  --surface-2: #1F2925;
  --line: #2B3732;
  --fg: #E7EFEB;
  --muted: #95A59D;
  --accent: #5CC4A6;
  --accent-ink: #0B1511;
  --c-weight: #5CC4A6;
  --c-sport: #E39A4A;
  --c-task: #8CA6F2;
  --c-event: #C58AE0;
  --danger: #F0847B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; }
.status { font-size: 0.8rem; color: var(--muted); }
.status[data-kind="err"] { color: var(--danger); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 880px) {
  .grid { grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start; }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }

/* Kalender */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cal-head h2 { flex: 1; min-width: 0; }
.icon-btn { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 1.1rem; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }
.text-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 12px; height: 36px; font-weight: 500; }
.text-btn:hover { background: var(--surface-2); }
.wd, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { margin-bottom: 4px; }
.wd span { text-align: center; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.cell { min-height: 52px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px; }
.cell.blank { pointer-events: none; }
button.cell:hover { background: var(--surface-2); }
.cell .n { font-variant-numeric: tabular-nums; font-weight: 500; }
.cell.today { border-color: var(--accent); }
.cell.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dots { display: flex; gap: 3px; min-height: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: block; }
.dot.w { background: var(--c-weight); }
.dot.s { background: var(--c-sport); }
.dot.t { background: var(--c-task); }
.dot.t.open { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c-task); }
.cell.sel .dot { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.cell.sel .dot.t.open { background: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent-ink); }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }

/* Tagesmaske */
.day-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.day-sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
.tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; white-space: nowrap; border: 0; background: transparent; border-radius: 7px; padding: 8px 4px; font-weight: 500; font-size: 0.92rem; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.tab.add { flex: 0 0 auto; padding: 8px 14px; }
.tab { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tab.lifted { background: var(--surface); color: var(--fg); box-shadow: 0 4px 14px rgba(0,0,0,0.18), 0 0 0 2px var(--accent); transform: scale(1.06); position: relative; z-index: 2; }
.tabs.reordering .tab:not(.lifted) { opacity: 0.75; }
.wk-tabs { margin: 0 0 10px; }
.wk-ev { display: flex; flex-direction: column; gap: 2px; }
.tab .mark { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.panel { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, .label { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="file"], textarea, select {
  width: 100%; min-width: 0; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line);
  background: var(--bg); border-radius: 8px;
}
textarea { resize: vertical; min-height: 160px; line-height: 1.5; }
input:disabled, textarea:disabled, button:disabled { opacity: 0.55; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 140px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 8px; padding: 0 16px; height: 42px; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.err { color: var(--danger); font-size: 0.88rem; margin: 0; min-height: 1.2em; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 0; }

.weight-big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.weight-big small { font-size: 1rem; font-weight: 500; color: var(--muted); margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; }
.chip:hover { background: var(--surface-2); }
.chipg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.chipg .chip { border: 0; border-radius: 0; }
.chip-x { padding: 4px 10px; color: var(--muted); }
.chipg .chip-x { border-left: 1px solid var(--line); }
.chip-x:hover { color: var(--danger); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; }
.item-main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item-main small { display: block; color: var(--muted); font-size: 0.85rem; }
.item-min { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.del { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 6px; font-size: 1.1rem; line-height: 1; flex: none; }
.del:hover { background: var(--surface-2); color: var(--danger); }
.list li.editing input[type="text"] { flex: 1 1 160px; }
.list li.editing { flex-wrap: wrap; }
.list input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.done .item-main { text-decoration: line-through; color: var(--muted); }
.carry h3 { font-size: 0.95rem; margin-bottom: 4px; }
.carry .list li { padding: 8px 0; }
.sum { font-size: 0.9rem; color: var(--muted); margin: 0; }

svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
svg.chart .grid-line { stroke: var(--line); stroke-width: 1; }
svg.chart .line { fill: none; stroke: var(--c-weight); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .pt { fill: var(--c-weight); }
svg.chart .pt-end { fill: var(--c-weight); stroke: var(--surface); stroke-width: 2; }
svg.chart .pt-sel { fill: none; stroke: var(--fg); stroke-width: 1.5; }
svg.chart text.val { fill: var(--fg); font-weight: 600; }
svg.chart .hit { fill: transparent; cursor: pointer; }
svg.chart .tip-ring { fill: none; stroke: var(--fg); stroke-width: 1.5; }
svg.chart .tip-box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
svg.chart text.tip-txt { fill: var(--fg); font-weight: 600; }

/* Ansichten */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.sticky[data-mode="year"] #tabs { display: none; }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; flex: 1 1 280px; max-width: 420px; }
.mode { border: 0; background: transparent; border-radius: 7px; padding: 8px 4px; font-weight: 500; font-size: 0.92rem; color: var(--muted); }
.mode[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.nav { display: flex; align-items: center; gap: 8px; flex: 1 1 300px; min-width: 0; }
.nav h2 { flex: 1; min-width: 0; font-size: 1.1rem; }
.grid[data-mode="day"], .grid[data-mode="year"] { grid-template-columns: minmax(0, 1fr); }
.grid[data-mode="day"] #viewCard, .grid[data-mode="year"] #dayCard { display: none; }
.grid[data-mode="day"] #dayLabel { display: none; }

.week { display: flex; flex-direction: column; gap: 4px; }
.wrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 12px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 10px; width: 100%; }
button.wrow:hover { background: var(--surface-2); }
.wrow.today { border-color: var(--accent); }
.wrow.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wday { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.wday b { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.wday span { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
.wparts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.9rem; min-width: 0; font-variant-numeric: tabular-nums; }
.wparts span { display: inline-flex; align-items: center; gap: 6px; }
.wparts .none { opacity: 0.6; }
.wrow.sel .dot { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.wrow.sel .dot.t.open { background: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent-ink); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat dt { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.stat dd { margin: 0; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 0.82rem; font-family: var(--font-body); font-weight: 400; display: block; }
.chart-wrap { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }

.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.mtile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; width: 100%; }
.mtile.cur { border-color: var(--accent); }
.mname { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.heat { display: grid; grid-template-columns: repeat(7, 8px); gap: 2px; }
.heat i { width: 8px; height: 8px; border-radius: 2px; background: var(--surface-2); display: block; }
.heat i.b { background: transparent; }
.heat i.l1 { background: var(--accent); opacity: 0.35; }
.heat i.l2 { background: var(--accent); opacity: 0.65; }
.heat i.l3 { background: var(--accent); }
.mstats { display: flex; flex-direction: column; gap: 2px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mstats span { display: block; }

/* Kalender-Abos und Termine */
.dot.e { background: var(--c-event); }
.dot.c { background: var(--accent); opacity: 0.7; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.events { display: flex; flex-direction: column; gap: 8px; }
.events + .panel:empty { display: none; }
.events h3 { font-family: var(--font-body); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.ev { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.ev .t { font-variant-numeric: tabular-nums; color: var(--c-event); font-weight: 600; flex: none; }
.ev .x { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ev small { display: block; color: var(--muted); font-size: 0.85rem; }
.maplink { display: inline-block; margin-top: 4px; font-size: 0.88rem; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.ev .del { align-self: center; }
.ev.tap, .ev[data-evkey] { cursor: pointer; border-radius: 8px; padding: 8px; margin: 0 -8px; }
.ev.tap:hover, .ev[data-evkey]:hover { background: var(--surface-2); }
.ev.open { background: var(--surface-2); }
.evnote-prev { font-style: italic; }
textarea.evnote { min-height: 140px; }
textarea.autogrow { resize: none; overflow: hidden; }
.evnotes { display: flex; flex-direction: column; gap: 6px; margin-top: -2px; }
.evnotes label { margin-top: 4px; }
.lbl-sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
.wparts span { max-width: 100%; overflow-wrap: anywhere; }
.abo h3 { font-size: 1rem; }
.abo summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
.list li.aboli { flex-wrap: wrap; }
.aboli .item-main { flex: 1 1 140px; }
.pick { display: flex; align-items: center; gap: 10px; text-transform: none; letter-spacing: 0; font-size: 0.95rem; color: var(--fg); font-weight: 400; padding: 4px 0; }
.pick input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.gnote { margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 640px) {
  body { padding-block: 10px 32px; }
  .app { gap: 12px; }
  h1 { font-size: 1.3rem; }
  .card { padding: 12px; }
  .mode, .tab { padding-block: 6px; }
  .nav h2 { font-size: 1rem; }
  .icon-btn { width: 34px; height: 34px; }
  .text-btn { height: 34px; padding: 0 10px; }
  .cell { min-height: 42px; padding: 4px 2px 3px; gap: 2px; }
  .wrow { padding: 6px 8px; grid-template-columns: 56px minmax(0, 1fr); }
  .wday { flex-direction: row; gap: 6px; align-items: baseline; }
  .wday b { font-size: 1rem; }
  .top-actions { gap: 6px; }
  .top-actions .status { font-size: 0.75rem; }
  .top-actions .text-btn { font-size: 0.85rem; padding: 0 9px; }
  h1 { font-size: 1.2rem; }
}
</style>

<main class="app">
  <header class="top">
    <h1>Planner</h1>
    <div class="top-actions">
      <span id="status" class="status" data-kind="load" role="status">Lädt …</span>
      <span id="syncInfo" class="status" role="status" hidden></span>
      <button type="button" class="text-btn" id="syncBtn" hidden>Aktualisieren</button>
      <button type="button" class="text-btn" id="aboBtn" aria-expanded="false" aria-controls="aboCard">Kalender</button>
    </div>
  </header>

  <div class="sticky" id="toolbar" data-mode="month">
  <div class="bar">
    <div class="modes" id="modes" role="tablist" aria-label="Ansicht">
      <button type="button" class="mode" role="tab" data-vm="day" aria-selected="false">Tag</button>
      <button type="button" class="mode" role="tab" data-vm="week" aria-selected="false">Woche</button>
      <button type="button" class="mode" role="tab" data-vm="month" aria-selected="true">Monat</button>
      <button type="button" class="mode" role="tab" data-vm="year" aria-selected="false">Jahr</button>
    </div>
    <div class="nav">
      <h2 id="rangeLabel"></h2>
      <button type="button" class="text-btn" id="todayBtn">Heute</button>
      <button type="button" class="icon-btn" id="prevBtn" aria-label="Zurück">‹</button>
      <button type="button" class="icon-btn" id="nextBtn" aria-label="Weiter">›</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Bereich"></div>
  </div>

  <p class="hint gnote" id="gNote" role="status" hidden></p>

  <section class="card" id="aboCard" hidden aria-label="Kalender-Abos">
    <div id="aboBody" class="panel abo"></div>
    <input type="file" id="aboUpdFile" class="sr" accept=".ics,text/calendar" tabindex="-1" aria-hidden="true">
  </section>

  <div class="grid" id="grid" data-mode="month">
    <section class="card" id="viewCard" aria-label="Übersicht">
      <div id="monthView">
      <div class="wd" aria-hidden="true"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
      <div class="days" id="days"></div>
      <ul class="legend" id="legend">
        <li><i class="dot w"></i>Gewicht</li>
        <li><i class="dot s"></i>Sport</li>
        <li><i class="dot t"></i>Aufgaben erledigt</li>
        <li><i class="dot t open"></i>Aufgaben offen</li>
        <li><i class="dot e"></i>Termine</li>
      </ul>
      <div id="monthExtra"></div>
      </div>
      <div id="weekView" hidden></div>
      <div id="yearView" hidden></div>
    </section>

    <section class="card" id="dayCard" aria-label="Tag">
      <div class="day-head" hidden>
        <h2 id="dayLabel"></h2>
        <p class="day-sub" id="daySub"></p>
      </div>
      <div class="events" id="events" hidden></div>
      <div class="panel" id="panel" role="tabpanel"></div>
    </section>
  </div>
  <p class="hint" style="text-align:center;font-size:0.75rem" id="appVer">Version 26</p>
</main>

<script>
(function () {
  'use strict';

  var MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var WDLONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  var SPORTS = ['Laufen','Radfahren','Krafttraining','Schwimmen','Yoga','Wandern','Fußball','Klettern','Gehen'];
  var TABS = [['events','Termine'],['weight','Gewicht'],['sport','Sport'],['tasks','Aufgaben'],['note','Notiz']];

  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function shortDate(k) { var d = parseKey(k); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; }
  function fmtKg(n) { return n.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(s) { return document.querySelector(s); }

  var todayKey = keyOf(new Date());
  var selected = todayKey;
  var viewDate = new Date(parseKey(todayKey).getFullYear(), parseKey(todayKey).getMonth(), 1);
  var tab = 'events';
  try { var savedTab = localStorage.getItem('tagesbuch:tab'); if (savedTab && (TABS.some(function (t) { return t[0] === savedTab; }) || /^c_/.test(savedTab))) tab = savedTab; } catch (e) {}
  var customTabs = [], addingTab = false, delTabAsk = false;
  var wtab = 'events';
  try { var sw = localStorage.getItem('tagesbuch:wtab'); if (sw) wtab = sw; } catch (e) {}
  var VMODES = ['day', 'week', 'month', 'year'];
  var vmode = 'month';
  try { var savedVm = localStorage.getItem('tagesbuch:vmode'); if (savedVm && VMODES.indexOf(savedVm) >= 0) vmode = savedVm; } catch (e) {}

  var days = {};
  var mode = null;      // 'db' | 'local'
  var ready = false;
  var col = null;
  var timers = {};
  var busy = {};
  var abos = {};        // id -> { name, updated, events: [{ id, date, time, end, title, loc, m }] }
  var evIdx = {};       // Datum -> [{ abo, aid, e }]
  var acol = null;
  var wImportMsg = null, openEv = null, openSport = null, editTask = null, evGeneral = {};
  try { var egr = JSON.parse(localStorage.getItem('tagesbuch:evgen') || '{}'); if (egr && typeof egr === 'object') evGeneral = egr; } catch (e) {}
  function titleKey(t) { return String(t || '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  var customSports = [], addingSport = false, sImportMsg = null;
  try { var csr = localStorage.getItem('tagesbuch:csports'); if (csr) customSports = JSON.parse(csr); } catch (e) {}
  try {
    if (localStorage.getItem('tagesbuch:sportsfull') !== '1') {
      customSports = SPORTS.slice(0, 6).concat(Array.isArray(customSports) ? customSports : []);
      localStorage.setItem('tagesbuch:sportsfull', '1');
      localStorage.setItem('tagesbuch:csports', JSON.stringify(customSports));
    }
  } catch (e) { customSports = SPORTS.slice(0, 6).concat(Array.isArray(customSports) ? customSports : []); }
  var aboOpen = false, aboMsg = null, delAsk = null, updId = null;
  var aboQ = {};
  var GSERVER = 'Google Calendar';
  var GDEF = [{ id: 'primary', name: 'Hauptkalender' }];
  var gMcp = null, gReady = false, gsel = null, pref = null;
  var gStore = {}, gLoaded = {}, gPending = {}, gLoading = 0;
  var gState = 'idle', gErrText = '';
  var gChoosing = false, gList = null;

  var elDays = $('#days'), elMonth = $('#rangeLabel'), elTabs = $('#tabs'), elPanel = $('#panel');
  var elDayLabel = $('#dayLabel'), elDaySub = $('#daySub'), elStatus = $('#status'), elAbo = $('#aboBody');

  /* ---------- Daten ---------- */
  function blank() { return { weight: null, sports: [], tasks: [], note: '', custom: {}, evnotes: {}, checks: {} }; }
  function normCustom(c) {
    var o = {};
    if (c && typeof c === 'object') Object.keys(c).forEach(function (k) { if (typeof c[k] === 'string' && c[k].trim()) o[k] = c[k]; });
    return o;
  }
  function normChecks(c) {
    var o = {};
    if (c && typeof c === 'object') Object.keys(c).forEach(function (t) {
      var m = c[t], n = {};
      if (m && typeof m === 'object') Object.keys(m).forEach(function (i) { if (m[i]) n[i] = 1; });
      if (Object.keys(n).length) o[t] = n;
    });
    return o;
  }
  function norm(d) {
    d = d || {};
    return {
      weight: typeof d.weight === 'number' && isFinite(d.weight) ? d.weight : null,
      sports: Array.isArray(d.sports) ? d.sports.filter(function (s) { return s && typeof s.type === 'string'; }) : [],
      tasks: Array.isArray(d.tasks) ? d.tasks.filter(function (t) { return t && typeof t.text === 'string'; }) : [],
      note: typeof d.note === 'string' ? d.note : '',
      custom: normCustom(d.custom),
      evnotes: normCustom(d.evnotes),
      checks: normChecks(d.checks)
    };
  }
  function isEmpty(d) { return d.weight == null && !d.sports.length && !d.tasks.length && !d.note.trim() && !Object.keys(d.custom || {}).length && !Object.keys(d.evnotes || {}).length && !Object.keys(d.checks || {}).length; }
  function ensure(k) { if (!days[k]) days[k] = blank(); return days[k]; }
  function sportMinutes(d) { return d.sports.reduce(function (a, s) { return a + (Number(s.min) || 0); }, 0); }

  /* ---------- Speichern ---------- */
  var STATUS = { load: 'Lädt …', saving: 'Speichert …', ok: 'Gespeichert', local: 'Auf diesem Gerät gespeichert', err: 'Speichern fehlgeschlagen' };
  function setStatus(kind) { elStatus.textContent = STATUS[kind]; elStatus.dataset.kind = kind; if (GCLIENT) elStatus.hidden = kind !== 'err'; }

  function saveLocal() {
    try {
      var out = {};
      Object.keys(days).forEach(function (k) { if (!isEmpty(days[k])) out[k] = days[k]; });
      localStorage.setItem('tagesbuch:days', JSON.stringify(out));
    } catch (e) {}
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem('tagesbuch:days');
      if (raw) { var o = JSON.parse(raw); Object.keys(o).forEach(function (k) { days[k] = norm(o[k]); }); }
    } catch (e) {}
  }
  async function persist(k) {
    var d = days[k];
    var empty = !d || isEmpty(d);
    if (mode === 'db') {
      var ref = col.doc(k);
      if (empty) await ref.delete();
      else await ref.set(JSON.parse(JSON.stringify(d)));
    } else {
      saveLocal();
    }
  }
  async function flush(k) {
    delete timers[k];
    if (busy[k]) { timers[k] = setTimeout(function () { flush(k); }, 300); return; }
    busy[k] = true;
    try {
      await persist(k);
      if (!Object.keys(timers).length) setStatus(mode === 'db' ? 'ok' : 'local');
    } catch (e) {
      setStatus('err');
    } finally {
      busy[k] = false;
    }
  }
  function commit(k, delay) {
    touchDay(k);
    setStatus(mode === 'db' ? 'saving' : 'local');
    clearTimeout(timers[k]);
    timers[k] = setTimeout(function () { flush(k); }, delay == null ? 250 : delay);
  }

  function onSnap(snap) {
    var seen = {};
    var changed = false;
    snap.docs.forEach(function (doc) {
      var k = doc.id;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      seen[k] = true;
      if (timers[k] || busy[k]) return;
      var nd = norm(doc.data());
      if (JSON.stringify(nd) !== JSON.stringify(days[k])) { days[k] = nd; changed = true; }
    });
    Object.keys(days).forEach(function (k) {
      if (!seen[k] && !timers[k] && !busy[k] && !isEmpty(days[k])) { delete days[k]; changed = true; }
    });
    var first = !ready;
    ready = true;
    if (first) { renderAll(); return; }
    if (changed) {
      renderCal(); renderHead(); renderTabs();
      var ae = document.activeElement;
      if (!(ae && elPanel.contains(ae) && /INPUT|TEXTAREA/.test(ae.tagName))) renderPanel();
    }
  }

  /* ---------- Kalender ---------- */
  function renderMonth() {
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var h = '';
    for (var i = 0; i < offset; i++) h += '<span class="cell blank"></span>';
    for (var d = 1; d <= dim; d++) {
      var k = y + '-' + pad(m + 1) + '-' + pad(d);
      var info = days[k];
      var dots = '', parts = [];
      if (tab === 'weight' && info && info.weight != null) { dots += '<i class="dot w"></i>'; parts.push(fmtKg(info.weight) + ' kg'); }
      else if (tab === 'sport' && info && info.sports.length) { dots += '<i class="dot s"></i>'; parts.push('Sport'); }
      else if (tab === 'tasks' && info && info.tasks.length) {
        var open = info.tasks.filter(function (t) { return !t.done; }).length;
        dots += '<i class="dot t' + (open ? ' open' : '') + '"></i>';
        parts.push(open ? open + ' offene Aufgaben' : 'Aufgaben erledigt');
      }
      else if (tab === 'events' && evIdx[k]) { dots += '<i class="dot e"></i>'; parts.push(evIdx[k].length + (evIdx[k].length === 1 ? ' Termin' : ' Termine')); }
      else if ((tab === 'note' || /^c_/.test(tab)) && dayHas(info, tab)) { dots += '<i class="dot c"></i>'; parts.push('Eintrag'); }
      var cls = 'cell' + (k === selected ? ' sel' : '') + (k === todayKey ? ' today' : '');
      h += '<button type="button" class="' + cls + '" data-k="' + k + '" aria-pressed="' + (k === selected) + '" aria-label="' +
        d + '. ' + MONTHS[m] + (parts.length ? ', ' + parts.join(', ') : '') + '"><span class="n">' + d + '</span><span class="dots">' + dots + '</span></button>';
    }
    elDays.innerHTML = h;
    var LEG = { events: '<li><i class="dot e"></i>Termine</li>', weight: '<li><i class="dot w"></i>Gewicht eingetragen</li>',
      sport: '<li><i class="dot s"></i>Sport eingetragen</li>', tasks: '<li><i class="dot t"></i>Aufgaben erledigt</li><li><i class="dot t open"></i>Aufgaben offen</li>' };
    $('#legend').innerHTML = LEG[tab] || '<li><i class="dot c"></i>Eintrag vorhanden</li>';
  }

  /* ---------- Ansichten: Tag, Woche, Monat, Jahr ---------- */
  var MON_SHORT = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

  function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function mondayOf(k) { return addDays(k, -((parseKey(k).getDay() + 6) % 7)); }
  function isoWeek(k) {
    var d = parseKey(k);
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dn = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dn);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  function range(vm) {
    if (vm === 'day') return [selected, selected];
    if (vm === 'week') { var s = mondayOf(selected); return [s, addDays(s, 6)]; }
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    if (vm === 'month') return [y + '-' + pad(m + 1) + '-01', y + '-' + pad(m + 1) + '-' + pad(new Date(y, m + 1, 0).getDate())];
    return [y + '-01-01', y + '-12-31'];
  }
  function inView(vm, k) { var r = range(vm); return k >= r[0] && k <= r[1]; }
  function defaultKeyForView(vm) {
    var tk = parseKey(todayKey);
    if (vm === 'year') return tk.getFullYear() === viewDate.getFullYear() ? todayKey : viewDate.getFullYear() + '-01-01';
    return tk.getFullYear() === viewDate.getFullYear() && tk.getMonth() === viewDate.getMonth() ? todayKey : keyOf(viewDate);
  }

  function stats(r) {
    var s = { sportDays: 0, sportMin: 0, wKeys: [], done: 0, total: 0 };
    Object.keys(days).filter(function (k) { return k >= r[0] && k <= r[1] && !isEmpty(days[k]); }).sort().forEach(function (k) {
      var d = days[k];
      if (d.sports.length) { s.sportDays++; s.sportMin += sportMinutes(d); }
      if (d.weight != null) s.wKeys.push(k);
      d.tasks.forEach(function (t) { s.total++; if (t.done) s.done++; });
    });
    return s;
  }
  function avgWeight(s) {
    if (!s.wKeys.length) return null;
    return s.wKeys.reduce(function (a, k) { return a + days[k].weight; }, 0) / s.wKeys.length;
  }
  function stat(label, val, sub) {
    return '<div class="stat"><dt>' + label + '</dt><dd>' + val + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</dd></div>';
  }
  function viewBlock(r) {
    var s = stats(r), avg = avgWeight(s);
    var wsub = '';
    if (s.wKeys.length >= 2) {
      var diff = days[s.wKeys[s.wKeys.length - 1]].weight - days[s.wKeys[0]].weight;
      wsub = 'Verlauf ' + (diff > 0 ? '+' : diff < 0 ? '−' : '±') + fmtKg(Math.abs(diff)) + ' kg';
    } else if (s.wKeys.length === 1) wsub = '1 Eintrag';
    var sv = s.sportDays ? s.sportDays + (s.sportDays === 1 ? ' Tag' : ' Tage') : '–';
    var ssub = s.sportDays ? (s.sportMin ? s.sportMin + ' min gesamt' : 'ohne Minuten') : '';
    var tv = s.total ? s.done + ' / ' + s.total : '–';
    var ctx = vmode === 'year' ? 'all' : tab;
    var chart = ctx === 'all' || ctx === 'weight' ? weightChart(s.wKeys) : '';
    var cards = '';
    if (ctx === 'all' || ctx === 'weight') cards += stat('Gewicht Ø', avg == null ? '–' : fmtKg(avg) + ' kg', wsub);
    if (ctx === 'all' || ctx === 'sport') cards += stat('Sport', sv, ssub);
    if (ctx === 'all' || ctx === 'tasks') cards += stat('Aufgaben', tv, s.total ? 'erledigt' : '');
    return (cards ? '<dl class="stats">' + cards + '</dl>' : '') +
      (chart ? '<div class="chart-wrap"><span class="label">Gewichtsverlauf</span>' + chart + '</div>' : '');
  }

  var tabOrder = [];
  try { var tor = JSON.parse(localStorage.getItem('tagesbuch:taborder') || '[]'); if (Array.isArray(tor)) tabOrder = tor.filter(function (x) { return typeof x === 'string'; }).slice(0, 40); } catch (e) {}
  function allTabs() {
    var list = TABS.concat(customTabs.map(function (c) { return ['c_' + c.id, c.name]; }));
    if (!tabOrder.length) return list;
    return list.map(function (t, i) { var o = tabOrder.indexOf(t[0]); return { t: t, o: o < 0 ? 1000 + i : o }; })
      .sort(function (a, b) { return a.o - b.o; }).map(function (x) { return x.t; });
  }
  function saveTabOrder() {
    try { localStorage.setItem('tagesbuch:taborder', JSON.stringify(tabOrder)); } catch (e) {}
    meta.taborder = Date.now(); saveMeta(); scheduleSync();
  }
  function tabExists(t) { return allTabs().some(function (x) { return x[0] === t; }); }
  function dayHas(d, t) {
    if (!d) return false;
    if (t === 'weight') return d.weight != null;
    if (t === 'sport') return d.sports.length > 0;
    if (t === 'tasks') return d.tasks.length > 0;
    if (t === 'note') return d.note.trim().length > 0;
    var tid = t.slice(2);
    return !!(d.custom && d.custom[tid]) || !!(d.checks && d.checks[tid]);
  }
  function snip(t) { t = t.replace(/\s+/g, ' ').trim(); return t.length > 70 ? t.slice(0, 70) + '…' : t; }
  function weekParts(k, t) {
    var d = days[k], p = [];
    if (t === 'events') {
      (evIdx[k] || []).forEach(function (x) {
        p.push('<span><i class="dot e"></i>' + (x.e.time ? esc(x.e.time) + ' ' : '') + esc(x.e.title) + '</span>');
      });
      return { p: p, none: 'Keine Termine' };
    }
    if (/^c_/.test(t)) {
      var tid = t.slice(2), due = dueItems(tid, k);
      if (due.length) {
        var dn = due.filter(function (it) { return isChecked(k, tid, it.id); }).length;
        p.push('<span><i class="dot c"></i>' + dn + '/' + due.length + ' erledigt' + (dn === due.length ? ' ✓' : '') + '</span>');
      }
      if (d && d.custom && d.custom[tid]) p.push('<span>' + esc(snip(d.custom[tid])) + '</span>');
      return { p: p, none: '–' };
    }
    if (!dayHas(d, t)) return { p: p, none: '–' };
    if (t === 'weight') p.push('<span><i class="dot w"></i>' + fmtKg(d.weight) + ' kg</span>');
    else if (t === 'sport') d.sports.forEach(function (s) {
      p.push('<span><i class="dot s"></i>' + esc(s.type) + (s.min ? ' · ' + esc(String(s.min)) + ' min' : '') + '</span>');
    });
    else if (t === 'tasks') d.tasks.forEach(function (x) {
      p.push('<span><i class="dot t' + (x.done ? '' : ' open') + '"></i>' + esc(x.text) + (x.done ? ' ✓' : '') + '</span>');
    });
    else if (t === 'note') p.push('<span>' + esc(snip(d.note)) + '</span>');
    else p.push('<span>' + esc(snip(d.custom[t.slice(2)])) + '</span>');
    return { p: p, none: '–' };
  }
  function renderWeek() {
    wtab = tabExists(tab) ? tab : 'events';
    var r = range('week');
    var h = '<div class="week">';
    for (var i = 0; i < 7; i++) {
      var k = addDays(r[0], i), dd = parseKey(k), w = weekParts(k, wtab);
      h += '<button type="button" class="wrow' + (k === selected ? ' sel' : '') + (k === todayKey ? ' today' : '') + '" data-k="' + k + '" aria-pressed="' + (k === selected) + '">' +
        '<span class="wday"><span>' + WDLONG[dd.getDay()].slice(0, 2) + '</span><b>' + dd.getDate() + '</b></span>' +
        '<span class="wparts' + (wtab === 'events' ? ' wk-ev' : '') + '">' + (w.p.length ? w.p.join('') : '<span class="none">' + w.none + '</span>') + '</span></button>';
    }
    return h + '</div>' + viewBlock(r);
  }

  function renderYear() {
    var y = viewDate.getFullYear(), tk = parseKey(todayKey);
    var h = '<p class="hint" style="margin-bottom:12px">Pro Monat siehst du die Durchschnittswerte. Je dunkler ein Feld, desto mehr Einträge an dem Tag.</p><div class="months">';
    for (var m = 0; m < 12; m++) {
      var dim = new Date(y, m + 1, 0).getDate();
      var off = (new Date(y, m, 1).getDay() + 6) % 7, heat = '', evN = 0;
      for (var i = 0; i < off; i++) heat += '<i class="b"></i>';
      for (var d = 1; d <= dim; d++) {
        var dk = y + '-' + pad(m + 1) + '-' + pad(d), x = days[dk], lvl = evIdx[dk] ? 1 : 0;
        if (evIdx[dk]) evN += evIdx[dk].length;
        if (x) lvl += (x.weight != null ? 1 : 0) + (x.sports.length ? 1 : 0) + (x.tasks.length ? 1 : 0);
        heat += '<i' + (lvl ? ' class="l' + Math.min(lvl, 3) + '"' : '') + '></i>';
      }
      var s = stats([y + '-' + pad(m + 1) + '-01', y + '-' + pad(m + 1) + '-' + pad(dim)]), lines = [], avg = avgWeight(s);
      if (s.sportDays) lines.push('Sport: ' + s.sportDays + (s.sportDays === 1 ? ' Tag' : ' Tage') + (s.sportMin ? ' · ' + s.sportMin + ' min' : ''));
      if (avg != null) lines.push('Gewicht Ø ' + fmtKg(avg) + ' kg');
      if (s.total) lines.push('Aufgaben ' + s.done + '/' + s.total);
      if (evN) lines.push('Termine ' + evN);
      if (!lines.length) lines.push('Keine Einträge');
      h += '<div class="mtile' + (y === tk.getFullYear() && m === tk.getMonth() ? ' cur' : '') + '" role="group" aria-label="' + MONTHS[m] + ' ' + y + '">' +
        '<span class="mname">' + MONTHS[m] + '</span><span class="heat" aria-hidden="true">' + heat + '</span>' +
        '<span class="mstats">' + lines.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</span></div>';
    }
    return h + '</div>' + viewBlock(range('year'));
  }

  function renderRange() {
    var t, d, y = viewDate.getFullYear();
    if (vmode === 'day') {
      d = parseKey(selected);
      t = WDLONG[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + (selected === todayKey ? ' (heute)' : '');
    } else if (vmode === 'week') {
      var r = range('week'), a = parseKey(r[0]), b = parseKey(r[1]);
      t = 'KW ' + isoWeek(r[0]) + ' · ' + (a.getMonth() === b.getMonth()
        ? a.getDate() + '.–' + b.getDate() + '. ' + MON_SHORT[b.getMonth()]
        : a.getDate() + '. ' + MON_SHORT[a.getMonth()] + ' – ' + b.getDate() + '. ' + MON_SHORT[b.getMonth()]) + ' ' + b.getFullYear();
    } else if (vmode === 'month') {
      t = MONTHS[viewDate.getMonth()] + ' ' + y;

      t = String(y);

    elMonth.textContent = t;
  }

  function renderCal() {
    var btns = document.querySelectorAll('#modes button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-selected', String(btns[i].dataset.vm === vmode));
    $('#grid').dataset.mode = vmode; $('#toolbar').dataset.mode = vmode;
    $('#monthView').hidden = vmode !== 'month';
    $('#weekView').hidden = vmode !== 'week';
    $('#yearView').hidden = vmode !== 'year';

    if (vmode === 'month') { renderMonth(); $('#monthExtra').innerHTML = viewBlock(range('month')); }
    else if (vmode === 'week') $('#weekView').innerHTML = renderWeek();
    else if (vmode === 'year') $('#yearView').innerHTML = renderYear();
  }

  function setVMode(m) {
    if ((vmode === 'month' || vmode === 'year') && !inView(vmode, selected)) selected = defaultKeyForView(vmode);
    vmode = m;
    if (m === 'day' || m === 'week') { var s = parseKey(selected); viewDate = new Date(s.getFullYear(), s.getMonth(), 1); }
    try { localStorage.setItem('tagesbuch:vmode', m); } catch (e) {}
    renderAll();
  }
  function stepView(dir) {
